<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Analyzer - Gamified</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; width: 100%; }
        .card {
            background: #2c2c3c;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 20px #ff00ff77;
            text-align: center;
        }
        h1 { font-weight: 700; letter-spacing: 2px; margin-bottom: 30px; }
        input[type="file"] { display: none; }
        label.upload-btn {
            display: inline-block;
            background: #00ff9f;
            color: #000;
            padding: 15px 25px;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 0 10px #00ff9f77;
        }
        label.upload-btn:hover { background: #00cc7a; box-shadow: 0 0 20px #00ff9faa; }
        textarea {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            padding: 10px;
            border: none;
            resize: none;
            margin-bottom: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }
        button.submit-btn {
            background: #00ff9f;
            border: none;
            font-weight: 700;
            padding: 15px 25px;
            border-radius: 15px;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }
        button.submit-btn:hover { background: #00cc7a; box-shadow: 0 0 20px #00ff9faa; }
        p.note { font-size: 0.8rem; color: #cccccc; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🚀 AI Resume Analyzer</h1>
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <input type="file" id="resume" name="resume" accept=".pdf">
            <label for="resume" class="upload-btn">📄 Select Resume (PDF)</label>
            <textarea name="job_description" placeholder="Paste Job Description here..." required></textarea>
            <button type="submit" class="submit-btn">Analyze Resume</button>
            <p class="note">Only PDF files accepted. Add a detailed job description for best results.</p>
        </form>
    </div>
</div>
</body>
</html>
